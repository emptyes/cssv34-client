name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast compile check of the whole tree with GCC. Runs in parallel with the Windows
  # build and doesn't gate it: it only reports compile errors minutes earlier.
  check-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends g++ pkg-config libsdl2-dev libfreetype-dev \
          libfontconfig-dev libopenal-dev libjpeg-dev libpng-dev libcurl4-gnutls-dev libbz2-dev libedit-dev

    # The checks of downloaded files must accept real content and reject broken files
    - name: File validation self-tests
      run: |
        cd src
        g++ -std=c++17 -O2 -DPOSIX=1 -D_POSIX=1 -DLINUX=1 -D_LINUX=1 -DPLATFORM_POSIX=1 -DGNUC -DCOMPILER_GCC=1 \
          -DPLATFORM_64BITS=1 -DNDEBUG -Ipublic -Ipublic/tier0 -Ipublic/tier1 -Ipublic/mathlib -Icommon -Idatacache \
          devtools/test_studio_validate.cpp -o /tmp/test_studio_validate
        /tmp/test_studio_validate
        g++ -std=c++17 -O2 -DPOSIX=1 -D_POSIX=1 -DLINUX=1 -D_LINUX=1 -DPLATFORM_POSIX=1 -DGNUC -DCOMPILER_GCC=1 \
          -DPLATFORM_64BITS=1 -DNDEBUG -Ipublic -Ipublic/tier0 -Ipublic/tier1 -Ipublic/mathlib -Icommon -Idatacache \
          devtools/check_mdl.cpp -o /tmp/check_mdl

    - name: Build linux-amd64 (release)
      run: |
        cd src
        python3 waf configure -T release --disable-warns --build-games=cstrike
        python3 waf build -j"$(nproc)"

  build-windows-amd64:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Prebuilt libjpeg/libpng/speex were compiled with /GL by another MSVC
    # version -> C1047 with LTO. Rebuild them here from the same sources.
    - name: Rebuild libjpeg, libpng, speex for LTO
      shell: pwsh
      run: |
        cd src

        $ErrorActionPreference = 'Stop'
        $root = $PWD.Path
        $out  = "$root\lib\win32\amd64"
        $cf   = @('/nologo','/c','/O2','/MT','/GL','/W0','/DNDEBUG','/D_CRT_SECURE_NO_WARNINGS')
        function Build-Lib([string]$name, [string[]]$srcs, [string[]]$extra) {
          $obj = "$root\ltolibs\$name"
          New-Item -ItemType Directory -Force $obj | Out-Null
          & cl @cf @extra "/Fo$obj\" @srcs
          if ($LASTEXITCODE -ne 0) { throw "cl failed for $name" }
          $objs = (Get-ChildItem "$obj\*.obj").FullName
          & lib /nologo /LTCG "/OUT:$out\$name.lib" @objs
          if ($LASTEXITCODE -ne 0) { throw "lib failed for $name" }
          Write-Host "$name.lib rebuilt from $($objs.Count) objects"
        }

        # libjpeg 9a
        $j = "$root\thirdparty\libjpeg"
        $jsrc = 'jmemnobs jaricom jcapimin jcapistd jcarith jccoefct jccolor jcdctmgr jchuff jcinit jcmainct jcmarker jcmaster jcomapi jcparam jcprepct jcsample jctrans jdapimin jdapistd jdarith jdatadst jdatasrc jdcoefct jdcolor jddctmgr jdhuff jdinput jdmainct jdmarker jdmaster jdmerge jdpostct jdsample jdtrans jerror jfdctflt jfdctfst jfdctint jidctflt jidctfst jidctint jquant1 jquant2 jutils jmemmgr'.Split(' ') | ForEach-Object { "$j\$_.c" }
        Build-Lib 'libjpeg' $jsrc @("/I$j")

        # libpng 1.6.38
        $p = "$root\thirdparty\libpng"
        $psrc = 'png pngerror pngget pngmem pngpread pngread pngrio pngrtran pngrutil pngset pngtrans pngwio pngwrite pngwtran pngwutil'.Split(' ') | ForEach-Object { "$p\$_.c" }
        Build-Lib 'libpng' $psrc @("/I$p", "/I$root\thirdparty\zlib")

        # speex 1.2.1 (same version as the old prebuilt speex.lib)
        Invoke-WebRequest 'https://github.com/xiph/speex/archive/refs/tags/Speex-1.2.1.tar.gz' -OutFile "$root\speex.tgz"
        tar -xzf "$root\speex.tgz" -C "$root\ltolibs"
        $s = "$root\ltolibs\speex-Speex-1.2.1"
        Copy-Item "$root\engine\voice_codecs\speex\speex\speex_config_types.h" "$s\include\speex\" -Force
        $ssrc = (Get-ChildItem "$s\libspeex\*.c" | Where-Object { $_.Name -notlike 'test*' }).FullName
        Build-Lib 'speex' $ssrc @('/DHAVE_CONFIG_H', "/I$s\win32", "/I$s\include", "/I$s\libspeex")

    - name: Build windows-amd64 (release)
      shell: pwsh
      run: |
        cd src
        python waf configure -T release --enable-lto --enable-speex --enable-opus --build-games=cstrike --prefix=../win64_build
        if ($LASTEXITCODE -ne 0) { throw "waf configure failed" }
        python waf install
        if ($LASTEXITCODE -ne 0) { throw "waf install failed" }

    - name: Pack game and debug symbols
      shell: pwsh
      run: |
        cd src

        New-Item -ItemType Directory -Force pdb | Out-Null
        $names = Get-ChildItem ../win64_build -Recurse -Include *.dll,*.exe | ForEach-Object { $_.BaseName }
        Get-ChildItem build -Recurse -Filter *.pdb | Where-Object { $names -contains $_.BaseName } | ForEach-Object { Copy-Item $_.FullName pdb\ -Force }
        Get-ChildItem pdb | Format-Table Name, Length
        7z a -mx9 cssv34_win64_pdb.7z .\pdb\*
        if ($LASTEXITCODE -ne 0) { throw "7z pdb failed" }
        # debug symbols ship separately in cssv34_win64_pdb.7z
        7z a -tzip cssv34_win64_optimized.zip ..\win64_build\* '-xr!*.pdb'
        if ($LASTEXITCODE -ne 0) { throw "7z game failed" }

        cd ..

    # Builds of other branches are not released: keep them downloadable from the run page
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: cssv34_win64_${{ github.sha }}
        path: |
          src/cssv34_win64_optimized.zip
          src/cssv34_win64_pdb.7z
        if-no-files-found: error
        retention-days: 14

    # The release description lists the commit subjects since the previous release. Without a
    # description GitHub shows the full message of the tagged commit, including its trailers.
    - name: Release notes
      if: github.ref == 'refs/heads/master'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # commit subjects are in Russian: read git's output as UTF-8
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        git config i18n.logOutputEncoding utf-8
        git fetch --quiet --unshallow origin
        $prev = gh release view --repo ${{ github.repository }} --json targetCommitish --jq .targetCommitish
        if ($LASTEXITCODE -ne 0 -or -not $prev) { $range = @('-20') } else { $range = @("$prev..HEAD") }
        $subjects = git log --no-merges --format='- %s' @range
        if ($LASTEXITCODE -ne 0 -or -not $subjects) { $subjects = git log -1 --format='- %s' }
        $notes = @('Изменения:', '') + $subjects
        Set-Content -Path release_notes.md -Value $notes -Encoding utf8
        Get-Content release_notes.md
        $global:LASTEXITCODE = 0

    - name: Publish release
      if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        body_path: release_notes.md
        target_commitish: ${{ github.sha }}
        fail_on_unmatched_files: true
        files: |
          src/cssv34_win64_optimized.zip
          src/cssv34_win64_pdb.7z
