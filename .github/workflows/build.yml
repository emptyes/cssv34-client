name: Build

on: [push, workflow_dispatch]

jobs:
  build-windows-amd64:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build windows-amd64 (release + LTO)
      run: |
        python waf configure -T release --enable-lto --enable-speex --enable-opus --build-games=cstrike --prefix=./win64_build
        python waf install

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cssv34_win64_optimized
        path: win64_build
        if-no-files-found: error
        retention-days: 30
